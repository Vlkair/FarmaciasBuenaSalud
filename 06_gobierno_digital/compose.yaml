name: peti-grupo10-s11
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: peti
      POSTGRES_PASSWORD: peti_lab
      POSTGRES_DB: peti
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - peti_datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peti -d peti"]
      interval: 5s
      timeout: 5s
      retries: 20
  metabase:
    image: metabase/metabase:latest
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: peti
      MB_DB_USER: peti
      MB_DB_PASS: peti_lab
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  peti_datos:
